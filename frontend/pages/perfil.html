<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040404" />
    <title>ALSTREAMING | Mi Perfil</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/Alex/frontend/src/css/miperfil.css" />

  </head>
  <body>
    <div class="perfil-container">
      <div class="perfil-header">
        <div class="avatar-container">
          <img
            id="avatarImg"
            src="https://via.placeholder.com/120"
            alt="Avatar"
            class="avatar-img"
          />
          <label for="inputAvatar" class="avatar-upload">
            <i class="fa-solid fa-camera"></i>
          </label>
          <input type="file" id="inputAvatar" accept="image/*" />
        </div>
        <h1 id="nombreUsuario">Cargando...</h1>
        <span id="rolBadge" class="rol-badge rol-customer">CLIENTE</span>
      </div>

      <div class="stats-info">
        <div class="stat-item">
          <div class="stat-valor" id="totalCompras">0</div>
          <div class="stat-label">Compras</div>
        </div>
        <div class="stat-item">
          <div class="stat-valor" id="miembroDesde">-</div>
          <div class="stat-label">Miembro desde</div>
        </div>
      </div>

      <form id="formPerfil">
        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Nombre de usuario</label>
          <input
            type="text"
            id="username"
            placeholder="Tu nombre de usuario"
            required
            disabled
          />
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-envelope"></i> Correo electrónico</label>
          <input
            type="email"
            id="email"
            placeholder="tu@email.com"
            required
          />
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-phone"></i> Teléfono</label>
          <input
            type="tel"
            id="phone"
            placeholder="+51 999 888 777"
          />
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-lock"></i> Nueva contraseña</label>
          <input
            type="password"
            id="password"
            placeholder="Dejar vacío para no cambiar"
            minlength="8"
          />
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-lock"></i> Confirmar contraseña</label>
          <input
            type="password"
            id="passwordConfirm"
            placeholder="Repite la nueva contraseña"
            minlength="8"
          />
        </div>

        <button type="submit" class="btn-guardar" id="btnGuardar">
          <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
        </button>
      </form>

      <a href="/Alex/index.html" class="btn-volver">
        <i class="fa-solid fa-arrow-left"></i> Volver al inicio
      </a>
    </div>

    <script>
      // ============================================================
      // PERFIL - CARGAR Y ACTUALIZAR DATOS
      // ============================================================
      
      const API_PERFIL = "/Alex/backend/api/perfil.php";
      let avatarFile = null;

      document.addEventListener("DOMContentLoaded", () => {
        // Verificar sesión
        const sesion = verificarSesion();
        
        if (!sesion) {
          window.location.replace("/Alex/frontend/pages/login.html");
          return;
        }

        // Cargar datos del perfil
        cargarPerfil(sesion);
        
        // Eventos
        document.getElementById("inputAvatar").addEventListener("change", previewAvatar);
        document.getElementById("formPerfil").addEventListener("submit", guardarPerfil);
      });

      // ============================================================
      // VERIFICAR SESIÓN
      // ============================================================
      function verificarSesion() {
        try {
          const sesionData = localStorage.getItem("alstreaming_session");
          if (!sesionData) return null;
          
          const session = JSON.parse(sesionData);
          
          if (Date.now() > session.expira) {
            localStorage.removeItem("alstreaming_session");
            return null;
          }
          
          return session;
        } catch (error) {
          return null;
        }
      }

      // ============================================================
      // CARGAR DATOS DEL PERFIL
      // ============================================================
      async function cargarPerfil(sesion) {
        try {
          // Mostrar datos del localStorage primero
          document.getElementById("nombreUsuario").textContent = sesion.username || "Usuario";
          document.getElementById("username").value = sesion.username || "";
          document.getElementById("email").value = sesion.email || "";
          document.getElementById("phone").value = sesion.phone || "";
          
          // ============================================================
          // 🔥 CORREGIDO: Mostrar avatar del localStorage
          // ============================================================
          if (sesion.avatar) {
            document.getElementById("avatarImg").src = imagenURL(sesion.avatar);
          }
          
          // Mostrar rol
          const rolBadge = document.getElementById("rolBadge");
          if (sesion.role === "admin") {
            rolBadge.textContent = "ADMINISTRADOR";
            rolBadge.className = "rol-badge rol-admin";
          } else {
            rolBadge.textContent = "CLIENTE";
            rolBadge.className = "rol-badge rol-customer";
          }

          // Cargar datos del servidor
          const response = await fetch(`${API_PERFIL}?action=get&id=${sesion.id}`, {
            credentials: "include"
          });
          
          const result = await response.json();
          
          if (result.success) {
            const user = result.data;
            
            document.getElementById("username").value = user.username || "";
            document.getElementById("email").value = user.email || "";
            document.getElementById("phone").value = user.phone || "";
            
            // ============================================================
            // 🔥 CORREGIDO: Mostrar avatar del servidor
            // ============================================================
            if (user.avatar) {
              document.getElementById("avatarImg").src = imagenURL(user.avatar);
            }
            
            document.getElementById("totalCompras").textContent = user.total_compras || 0;
            document.getElementById("miembroDesde").textContent = formatDate(user.created_at);
            
            // Actualizar localStorage con datos del servidor
            actualizarLocalStorage(user);
          }
        } catch (error) {
          console.error("Error cargando perfil:", error);
          mostrarNotificacion("Error al cargar los datos del perfil", "error");
        }
      }

      // ============================================================
      // PREVIEW AVATAR
      // ============================================================
      function previewAvatar() {
        const file = document.getElementById("inputAvatar").files[0];
        if (!file) return;
        
        avatarFile = file;
        
        const reader = new FileReader();
        reader.onload = () => {
          document.getElementById("avatarImg").src = reader.result;
        };
        reader.readAsDataURL(file);
      }

      // ============================================================
      // GUARDAR PERFIL
      // ============================================================
      async function guardarPerfil(e) {
        e.preventDefault();
        
        const btnGuardar = document.getElementById("btnGuardar");
        const password = document.getElementById("password").value;
        const passwordConfirm = document.getElementById("passwordConfirm").value;
        
        // Validar contraseñas
        if (password || passwordConfirm) {
          if (password !== passwordConfirm) {
            mostrarNotificacion("Las contraseñas no coinciden", "error");
            return;
          }
          if (password.length < 8) {
            mostrarNotificacion("La contraseña debe tener mínimo 8 caracteres", "error");
            return;
          }
        }
        
        btnGuardar.disabled = true;
        btnGuardar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
        
        try {
          let avatarUrl = "";
          
          // Subir avatar si hay archivo nuevo
          if (avatarFile) {
            const formData = new FormData();
            formData.append("avatar", avatarFile);
            
            const uploadResponse = await fetch(`${API_PERFIL}?action=upload`, {
              method: "POST",
              body: formData
            });
            
            const uploadResult = await uploadResponse.json();
            
            if (uploadResult.success) {
              avatarUrl = uploadResult.url;
            } else {
              mostrarNotificacion(uploadResult.message || "Error al subir avatar", "error");
              btnGuardar.disabled = false;
              btnGuardar.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar Cambios';
              return;
            }
          }
          
          // Actualizar datos
          const sesion = verificarSesion();
          
          const data = {
            id: sesion.id,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value
          };
          
          if (password) {
            data.password = password;
          }
          
          if (avatarUrl) {
            data.avatar = avatarUrl;
          }
          
          const response = await fetch(`${API_PERFIL}?action=update`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
          });
          
          const result = await response.json();
          
          if (result.success) {
            mostrarNotificacion("Perfil actualizado correctamente", "success");
            
            // Actualizar localStorage con los datos retornados
            if (result.data) {
              actualizarLocalStorage(result.data);
              
              // ============================================================
              // 🔥 CORREGIDO: Actualizar avatar en la página inmediatamente
              // ============================================================
              if (result.data.avatar) {
                document.getElementById("avatarImg").src = imagenURL(result.data.avatar);
              }
            }
            
            avatarFile = null;
            document.getElementById("password").value = "";
            document.getElementById("passwordConfirm").value = "";
          } else {
            mostrarNotificacion(result.message || "Error al actualizar", "error");
          }
        } catch (error) {
          console.error("Error guardando perfil:", error);
          mostrarNotificacion("Error al guardar los cambios", "error");
        } finally {
          btnGuardar.disabled = false;
          btnGuardar.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar Cambios';
        }
      }

      // ============================================================
      // ACTUALIZAR LOCALSTORAGE
      // ============================================================
      function actualizarLocalStorage(user) {
        try {
          const sesionActual = JSON.parse(localStorage.getItem("alstreaming_session"));
          
          const nuevaSesion = {
            ...sesionActual,
            username: user.username || sesionActual.username,
            email: user.email || sesionActual.email,
            phone: user.phone || sesionActual.phone,
            avatar: user.avatar || sesionActual.avatar
          };
          
          localStorage.setItem("alstreaming_session", JSON.stringify(nuevaSesion));
          console.log("✅ localStorage actualizado con avatar:", nuevaSesion.avatar);
        } catch (error) {
          console.error("Error actualizando localStorage:", error);
        }
      }

      // ============================================================
      // 🔥 CORREGIDO: UTILIDAD IMAGEN URL
      // ============================================================
      function imagenURL(img) {
        if (!img) return "https://via.placeholder.com/120";
        if (img.startsWith("http")) return img;
        if (img.startsWith("data:")) return img;
        if (img.startsWith("/")) return img;
        // Si es ruta relativa tipo "uploads/avatars/..."
        return "/Alex/" + img;
      }

      function formatDate(dateString) {
        if (!dateString) return "-";
        const date = new Date(dateString);
        return date.toLocaleDateString("es-PE", {
          year: "numeric",
          month: "long",
          day: "numeric"
        });
      }

      function mostrarNotificacion(mensaje, tipo = "info") {
        // Eliminar notificaciones anteriores
        const oldNotif = document.querySelector(".notificacion");
        if (oldNotif) oldNotif.remove();
        
        const div = document.createElement("div");
        div.className = `notificacion ${tipo}`;
        div.textContent = mensaje;
        document.body.appendChild(div);
        
        setTimeout(() => {
          div.remove();
        }, 4000);
      }
    </script>
  </body>
</html>
